# GitHub Actions schedule. NOT active: it only runs from .github/workflows/, and
# it needs resume.txt and data/ committed, which a public repo shouldn't have.
# To use it: make the repo private, remove resume.txt / resume/ / data/ from
# .gitignore, and move this file to .github/workflows/job_finder.yml.
name: job-finder

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:         # lets you click "Run workflow" manually

permissions:
  contents: write            # needed to save seen_jobs.json back to the repo

concurrency: job-finder

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Find jobs
        run: python job_finder.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save seen jobs
        run: |
          git config user.name "job-finder-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data resume
          git diff --staged --quiet || git commit -m "Update seen jobs"
          git push
